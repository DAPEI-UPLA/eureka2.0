<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Prisma">
  <title>Prisma — el faro que dispersa</title>

  <rect width="64" height="64" rx="15" fill="#1d1d1b"/>

  <!-- La estrella del escudo institucional -->
  <path d="M22 3.6 22.98 6.46 25.99 6.5 23.58 8.31 24.47 11.2 22 9.46 19.53 11.2 20.42 8.31 18.01 6.5 21.02 6.46z"
        fill="#ffffff"/>

  <!-- Escalinata -->
  <rect x="10.5" y="51.5" width="23" height="4" rx="1.5" fill="#878786"/>
  <rect x="7"    y="56.3" width="30" height="4" rx="1.5" fill="#878786"/>

  <!-- Torre -->
  <path d="M12.5 51.5 16.8 26.2h10.4l4.3 25.3z" fill="#ffffff"/>
  <!-- Linterna -->
  <rect x="15.25" y="21.7" width="13.5" height="4.5" rx="1.3" fill="#ffffff"/>
  <!-- Frontón -->
  <path d="M22 14.2 30 21.7H14z" fill="#ffffff"/>

  <!-- Vanos -->
  <rect x="20.1" y="32"   width="3.8" height="6.5" rx="1.9" fill="#009fe3"/>
  <rect x="20.1" y="41.5" width="3.8" height="6.5" rx="1.9" fill="#009fe3"/>

  <!-- El haz se abre en indicadores -->
  <g stroke-width="3.4" stroke-linecap="round" fill="none">
    <path d="M32.5 21.2 57 13"   stroke="#bfe8f8"/>
    <path d="M33 22.7 52 19.5"   stroke="#7fd1f1"/>
    <path d="M33 24.6 59.5 29"   stroke="#3fb8ea"/>
    <path d="M32.5 26.2 51 34.5" stroke="#009fe3"/>
  </g>
</svg>
