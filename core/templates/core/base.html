<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            overflow-x: hidden;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background-color: #212529;
            transition: margin-left 0.3s ease;
        }

        .sidebar.hidden {
            margin-left: -250px;
        }

        .sidebar a {
            color: #ffffff;
            text-decoration: none;
        }

        .sidebar a:hover {
            background-color: #343a40;
        }

        .content {
            width: 100%;
            padding: 20px;
        }

        .topbar {
            height: 56px;
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
        }
        .proyecto-card {
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            transition: all 0.25s ease;
        }

        .proyecto-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
        }

        .proyecto-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 8px;
        }

        .borde-planificado::before { background: #6c757d; }
        .borde-ejecucion::before   { background: #0d6efd; }
        .borde-finalizado::before  { background: #198754; }
        .borde-suspendido::before  { background: #dc3545; }


    </style>
</head>
<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar p-3">
        <h5 class="text-white mb-4">Menú</h5>

        <ul class="nav nav-pills flex-column gap-2">
            <li class="nav-item">
                <a class="nav-link text-white" href="{% url 'home' %}">
                    🏠 Inicio
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="{% url 'planificacion:home' %}">
                    📅 Planificación
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="#">
                    📊 Análisis
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="#">
                    📁 Proyectos
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="#">
                    🔁 OCT
                </a>
            </li>
        </ul>
    </div>

    <!-- Main -->
    <div class="flex-grow-1">

        <!-- Topbar -->
        <div class="topbar d-flex align-items-center px-3 justify-content-between">
            <button id="toggleSidebar" class="btn btn-outline-secondary btn-sm">
                ☰
            </button>

            <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">
                Cerrar sesión
            </a>
        </div>

        <!-- Content -->
        <div class="content">
            {% block content %}{% endblock %}
        </div>

    </div>
</div>

<!-- Sidebar Toggle Script -->
<script>
    const btn = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');

    btn.addEventListener('click', () => {
        sidebar.classList.toggle('hidden');
    });
</script>

<!-- ✅ Bootstrap JS Bundle (NECESARIO para modal y accordion) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>

<script>
  document.body.addEventListener('htmx:configRequest', (event) => {
    event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
  });
</script>


</body>
</html>
