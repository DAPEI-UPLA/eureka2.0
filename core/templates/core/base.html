<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            overflow-x: hidden;
            background-color: #f4f4f4;
            color: #565656;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            min-height: 100vh;
            background-color: #2f3a45; /* Gris institucional neutro */
            transition: margin-left 0.3s ease;
            padding-top: 20px;
        }

        .sidebar.hidden {
            margin-left: -260px;
        }

        .sidebar-title {
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        /* Links */
        .sidebar .nav-link {
            color: #dcdcdc;
            border-radius: 8px;
            padding: 10px 14px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .sidebar .nav-link:hover {
            background-color: rgba(0, 159, 227, 0.15);
            color: #ffffff;
        }

        .sidebar .nav-link.active {
            background-color: #009fe3; /* Azul UPLA como acento */
            color: #ffffff;
        }

        /* ===== TOPBAR ===== */
        .topbar {
            height: 60px;
            background-color: #ffffff;
            border-bottom: 1px solid #e5e5e5;
        }

        .btn-outline-secondary {
            border-color: #009fe3;
            color: #009fe3;
        }

        .btn-outline-secondary:hover {
            background-color: #009fe3;
            color: #ffffff;
        }

        .btn-outline-danger {
            border-radius: 50px;
        }

        /* ===== CONTENT ===== */
        .content {
            width: 100%;
            padding: 30px;
        }

        /* ===== TARJETAS PROYECTOS (mejoradas) ===== */
        .proyecto-card {
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transition: all 0.25s ease;
            border: none;
        }

        .proyecto-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0, 159, 227, 0.12);
        }

        .proyecto-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 6px;
        }

        .borde-planificado::before { background: #6c757d; }
        .borde-ejecucion::before   { background: #009fe3; }
        .borde-finalizado::before  { background: #198754; }
        .borde-suspendido::before  { background: #dc3545; }

    </style>
</head>
<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar p-3">
        <h5 class="text-white mb-4">Menú</h5>

        <ul class="nav nav-pills flex-column gap-2">

            <!-- INICIO -->
            <li class="nav-item">
                <a class="nav-link" href="{% url 'home' %}">
                    🏠 Inicio
                </a>
            </li>

            <!-- PLANIFICACIÓN -->
            <li class="nav-item">
                <a class="nav-link d-flex justify-content-between align-items-center"
                data-bs-toggle="collapse"
                href="#menuPlanificacion"
                role="button">
                    📊 Planificación
                    <span>▾</span>
                </a>

                <div class="collapse ms-3" id="menuPlanificacion">
                    <ul class="nav flex-column mt-2">
                        <li class="nav-item">
                            <a class="nav-link small" href="{% url 'planificacion:home' %}">
                                Indicadores
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link small" href="#">
                                Programas
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link small" href="#">
                                Objetivos
                            </a>
                        </li>
                    </ul>
                </div>
            </li>

            <!-- PROYECTOS -->
            <li class="nav-item">
                <a class="nav-link d-flex justify-content-between align-items-center"
                data-bs-toggle="collapse"
                href="#menuProyectos"
                role="button">
                    📁 Proyectos
                    <span>▾</span>
                </a>

                <div class="collapse ms-3" id="menuProyectos">
                    <ul class="nav flex-column mt-2">
                        <li class="nav-item">
                            <a class="nav-link small" href="{% url 'proyectos:lista_proyectos' %}">
                                Lista de proyectos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link small" href="#">
                                Crear proyecto
                            </a>
                        </li>
                    </ul>
                </div>
            </li>

            <!-- OCT -->
            <li class="nav-item">
                <a class="nav-link d-flex justify-content-between align-items-center"
                data-bs-toggle="collapse"
                href="#menuOCT"
                role="button">
                    🤝 OCT
                    <span>▾</span>
                </a>

                <div class="collapse ms-3" id="menuOCT">
                    <ul class="nav flex-column mt-2">
                        <li class="nav-item">
                            <a class="nav-link small" href="{% url 'oct:home' %}">
                                Iniciativas
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link small" href="#">
                                
                            </a>
                        </li>
                    </ul>
                </div>
            </li>

        </ul>
    </div>

    <!-- Main -->
    <div class="flex-grow-1">

        <!-- Topbar -->
        <div class="topbar d-flex align-items-center px-3 justify-content-between">
            <button id="toggleSidebar" class="btn btn-outline-secondary btn-sm">
                ☰
            </button>

            <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">
                Cerrar sesión
            </a>
        </div>

        <!-- Content -->
        <div class="content">
            {% block content %}{% endblock %}
        </div>

    </div>
</div>

<!-- Sidebar Toggle Script -->
<script>
    const btn = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');

    btn.addEventListener('click', () => {
        sidebar.classList.toggle('hidden');
    });
</script>

<!-- ✅ Bootstrap JS Bundle (NECESARIO para modal y accordion) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>

<script>
  document.body.addEventListener('htmx:configRequest', (event) => {
    event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
  });
</script>


</body>
</html>
