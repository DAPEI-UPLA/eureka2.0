{# Título del objetivo en modo lectura. Un clic simple abre la edición. #}
<div class="objetivo-titulo"
     hx-get="{% url 'proyectos:editar_objetivo_form' objetivo.pk %}"
     hx-trigger="click"
     hx-target="this"
     hx-swap="outerHTML"
     onclick="event.stopPropagation();"
     title="Clic para editar la descripción">
    {% if objetivo.descripcion %}
        <span>{{ objetivo.descripcion }}</span>
    {% else %}
        <span class="texto-vacio">Sin descripción — clic para escribirla</span>
    {% endif %}
    <span class="editar-hint" aria-hidden="true">✎</span>
</div>
