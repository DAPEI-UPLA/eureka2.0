{% load humanize %}
<div id="presupuesto-obj-{{ objetivo.pk }}" class="presupuesto-mini">

<form hx-post="{% url 'proyectos:editar_presupuesto_objetivo' objetivo.pk %}"
      hx-target="#presupuesto-obj-{{ objetivo.pk }}"
      hx-swap="outerHTML"
      class="d-flex align-items-center gap-2">

    <div class="d-flex flex-column gap-1">
        <input type="text"
               name="presupuesto_corriente"
               value="{{ objetivo.presupuesto_corriente|floatformat:0 }}"
               class="form-control form-control-sm"
               placeholder="Corriente"
               style="width: 130px;"
               data-autofoco="1">
        <input type="text"
               name="presupuesto_capital"
               value="{{ objetivo.presupuesto_capital|floatformat:0 }}"
               class="form-control form-control-sm"
               placeholder="Capital"
               style="width: 130px;">
    </div>

    <div class="d-flex flex-column gap-1">
        <button type="submit" class="btn btn-soft-success btn-icon btn-sm" title="Guardar">✓</button>
        <button type="button"
                class="btn btn-soft-danger btn-icon btn-sm"
                title="Cancelar"
                hx-get="{% url 'proyectos:meta_objetivo' objetivo.pk %}"
                hx-target="#objetivo-meta-{{ objetivo.pk }}"
                hx-swap="innerHTML">✕</button>
    </div>

</form>
</div>
