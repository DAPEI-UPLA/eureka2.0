<div class="objetivo-grupo mb-4 rounded-3 shadow-sm border bg-white">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center px-4 py-3"
         onclick="toggleObjetivo({{ objetivo.pk }})"
         style="cursor:pointer; background:#f8f9fa;">

        {% include "proyectos/partials/objetivo_texto.html" %}

        <div class="text-muted small">
            {{ objetivo.resultados.count }} tareas
        </div>
    </div>

    <!-- CONTENIDO -->
    <div id="grupo-{{ objetivo.pk }}">

        <table class="table align-middle mb-0">
            <thead class="table-light small text-muted">
                <tr>
                    <th style="width:30%">Tarea</th>
                    <th>Responsable</th>
                    <th>Estado</th>
                    <th>Presupuesto</th>
                    <th style="width:20%">Avance</th>
                    <th></th>
                </tr>
            </thead>

            <tbody id="resultados-{{ objetivo.pk }}">
                {% for resultado in objetivo.resultados.all %}
                    {% include "proyectos/partials/resultado_row.html" %}
                {% empty %}
                    <tr>
                        <td colspan="6" class="text-center text-muted py-3">
                            Sin resultados
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="px-4 py-2 border-top bg-light">
            <button class="btn btn-sm btn-outline-secondary"
                    hx-post="{% url 'proyectos:crear_resultado' objetivo.pk %}"
                    hx-target="#resultados-{{ objetivo.pk }}"
                    hx-swap="beforeend">
                + Agregar resultado
            </button>
        </div>

    </div>
</div>
