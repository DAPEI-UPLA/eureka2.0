{# Fila desplegable con los planes de gasto de la actividad. #}
<tr id="planes-row-{{ actividad.pk }}" class="d-none bg-light">
    <td colspan="10" class="px-3 py-2">
        <div id="planes-cell-{{ actividad.pk }}"
             data-loaded="0"
             data-url="{% url 'proyectos:listar_planes_actividad' actividad.pk %}">
            <div class="text-muted small">Click ▶ para cargar planes de gasto.</div>
        </div>
    </td>
</tr>
